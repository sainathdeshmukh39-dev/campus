  <title>Campus Lost & Found | University Belonging Recovery Platform</title>
  <meta name="description" content="Centralized campus lost and found platform for university students and staff to report, track, and recover lost belongings safely." />

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with custom config -->

      theme: {
        extend: {
          colors: {
            campus: {
              50: '#f0f4f9',
              100: '#e1e9f3',

              800: '#112240',

            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif']

  <!-- Lucide Icons & React 18 & Babel for Browser Live Render -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    .animate-float {
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
  </style>
</head>

      {

      },
      {
        id: 'item-6',
        user_id: 'user-student-1',
        reporter_name: 'Alex Morgan',
        reporter_email: 'alex.student@campus.edu',
        type: 'lost',
        title: 'Calculus: Early Transcendentals (9th Edition)',
        category: 'Books',
        description: 'Hardcover textbook with yellow highlighter on chapter 4.',
        location: 'Science Block B, Chemistry Lecture Hall 3',

        image_url: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80',
        identifying_details: 'Has sticky tab markers on integration techniques.',
        contact_preference: 'in_app',
        status: 'open',
        is_flagged: false,
        views_count: 48,
        created_at: '2026-10-19T10:00:00Z'
      }
    ];

    const INITIAL_CLAIMS = [
      {
        id: 'claim-1',
        item_id: 'item-2',
        item_title: 'Sony WH-1000XM4 Noise Canceling Headphones',
        claimant_id: 'user-student-1',
        claimant_name: 'Alex Morgan',
        claimant_email: 'alex.student@campus.edu',
        item_owner_id: 'user-staff-1',
        proof_description: 'Bluetooth name is "Alex-M4". Left ear cushion has a tiny scratch on the pivot hinge.',
        contact_info: 'alex.student@campus.edu / (555) 234-5678',
        message: 'Forgot them on seat B row 4 after the 10 AM seminar.',
        status: 'pending',
        created_at: '2026-10-23T14:20:00Z'
      }
    ];

    const INITIAL_NOTIFICATIONS = [
      {
        id: 'notif-1',
        user_id: 'user-staff-1',
        title: 'New Claim Received',
        message: 'Alex Morgan submitted a claim request for "Sony WH-1000XM4 Noise Canceling Headphones".',
        type: 'claim_received',
        is_read: false,
        created_at: '2026-10-23T14:20:00Z'
      },
      {
        id: 'notif-2',
        user_id: 'user-student-1',
        title: 'Campus Lost & Found Welcome',
        message: 'Welcome to Campus Lost & Found! Report missing belongings or help peers reconnect with lost items.',
        type: 'info',
        is_read: true,
        created_at: '2026-10-18T09:00:00Z'
      }
    ];

    const ITEM_CATEGORIES = ['Electronics', 'ID Cards', 'Books', 'Bags', 'Keys', 'Clothing', 'Accessories', 'Other'];
    const CAMPUS_LOCATIONS = [
      'Central Library',
      'Student Center & Dining Commons',
      'Engineering Quad',
      'Science Block B',
      'Sports Complex & Gymnasium',
      'Innovation Hub & Computer Labs',
      'Main Auditorium & Arts Center'
    ];

    // --- CONTEXT ---
    const AppContext = createContext();

    function AppProvider({ children }) {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('clf_user');
        return saved ? JSON.parse(saved) : INITIAL_PROFILES[0];
      });

      const [items, setItems] = useState(() => {
        const saved = localStorage.getItem('clf_items');
        return saved ? JSON.parse(saved) : INITIAL_ITEMS;
      });

      const [claims, setClaims] = useState(() => {
        const saved = localStorage.getItem('clf_claims');
        return saved ? JSON.parse(saved) : INITIAL_CLAIMS;
      });

      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('clf_notifs');
        return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
      });

      const [currentView, setCurrentView] = useState('landing');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedLocation, setSelectedLocation] = useState('All');
      const [selectedTab, setSelectedTab] = useState('all');
      const [sortOrder, setSortOrder] = useState('newest');
      const [viewMode, setViewMode] = useState('grid');

      // Modals
      const [authModalOpen, setAuthModalOpen] = useState(false);
      const [authModalMode, setAuthModalMode] = useState('login');
      const [reportModalOpen, setReportModalOpen] = useState(false);
      const [reportModalType, setReportModalType] = useState('lost');
      const [editingItem, setEditingItem] = useState(null);
      const [detailModalItem, setDetailModalItem] = useState(null);
      const [claimModalItem, setClaimModalItem] = useState(null);
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        if (currentUser) localStorage.setItem('clf_user', JSON.stringify(currentUser));
        else localStorage.removeItem('clf_user');
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('clf_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('clf_claims', JSON.stringify(claims));
      }, [claims]);

      useEffect(() => {
        localStorage.setItem('clf_notifs', JSON.stringify(notifications));
      }, [notifications]);

      const showToast = (message, type = 'info') => {
        const id = Date.now() + Math.random().toString();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 4000);
      };

      const removeToast = (id) => setToasts(prev => prev.filter(t => t.id !== id));

      const handleLogin = (email) => {
        const found = INITIAL_PROFILES.find(p => p.email.toLowerCase() === email.toLowerCase());
        const user = found || {
          id: 'user-' + Date.now(),
          email,
          full_name: email.split('@')[0],
          role: email.includes('admin') ? 'admin' : 'student'
        };
        setCurrentUser(user);
        showToast(`Logged in as ${user.full_name} (${user.role.toUpperCase()})`, 'success');
        return user;
      };

      const handleLogout = () => {
        setCurrentUser(null);
        showToast('Signed out of campus network.', 'info');
      };

      const switchDemoPersona = (role) => {
        const target = INITIAL_PROFILES.find(p => p.role === role) || INITIAL_PROFILES[0];
        setCurrentUser(target);
        showToast(`Switched active persona to ${target.full_name} (${target.role.toUpperCase()})`, 'success');
      };

      const saveItem = (itemData) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }

        if (editingItem) {
          const updated = { ...editingItem, ...itemData };
          setItems(prev => prev.map(i => i.id === editingItem.id ? updated : i));
          setEditingItem(null);
          showToast('Item report updated successfully!', 'success');
          return updated;
        }

        const newItem = {
          id: 'item-' + Date.now(),
          user_id: currentUser.id,
          reporter_name: currentUser.full_name,
          reporter_email: currentUser.email,
          views_count: 1,
          status: 'open',
          is_flagged: false,
          created_at: new Date().toISOString(),
          image_url: itemData.image_url || 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?auto=format&fit=crop&w=800&q=80',
          ...itemData
        };
        setItems(prev => [newItem, ...prev]);
        showToast(`${newItem.type === 'lost' ? 'Lost' : 'Found'} item published!`, 'success');
        return newItem;
      };

      const deleteItem = (itemId) => {
        setItems(prev => prev.filter(i => i.id !== itemId));
        showToast('Report deleted.', 'info');
      };

      const toggleFlagItem = (itemId) => {
        setItems(prev => prev.map(i => i.id === itemId ? { ...i, is_flagged: !i.is_flagged } : i));
        showToast('Post flag status updated.', 'info');
      };

      const submitClaim = (claimData) => {
        if (!currentUser) {
          setAuthModalOpen(true);
          return;
        }
        const targetItem = items.find(i => i.id === claimData.item_id);
        const newClaim = {
          id: 'claim-' + Date.now(),
          item_id: targetItem.id,
          item_title: targetItem.title,
          claimant_id: currentUser.id,
          claimant_name: currentUser.full_name,
          claimant_email: currentUser.email,
          item_owner_id: targetItem.user_id,
          proof_description: claimData.proof_description,
          contact_info: claimData.contact_info,
          message: claimData.message,
          status: 'pending',
          created_at: new Date().toISOString()
        };
        setClaims(prev => [newClaim, ...prev]);
        setItems(prev => prev.map(i => i.id === targetItem.id ? { ...i, status: 'claim_pending' } : i));
        
        // Notification to finder
        setNotifications(prev => [{
          id: 'notif-' + Date.now(),
          user_id: targetItem.user_id,
          title: 'New Ownership Claim Submitted',
          message: `${currentUser.full_name} claimed "${targetItem.title}". Review proof in dashboard.`,
          is_read: false,
          created_at: new Date().toISOString()
        }, ...prev]);

        showToast('Claim submitted to finder! Check dashboard for updates.', 'success');
      };

      const reviewClaim = (claimId, newStatus) => {
        const claim = claims.find(c => c.id === claimId);
        setClaims(prev => prev.map(c => c.id === claimId ? { ...c, status: newStatus } : c));
        
        if (newStatus === 'completed') {
          setItems(prev => prev.map(i => i.id === claim.item_id ? { ...i, status: 'returned' } : i));
          showToast('Claim approved! Item marked as Returned.', 'success');
        } else {
          setItems(prev => prev.map(i => i.id === claim.item_id ? { ...i, status: 'open' } : i));
          showToast('Claim rejected.', 'info');
        }
      };

      const stats = {
        totalLost: items.filter(i => i.type === 'lost').length,
        totalFound: items.filter(i => i.type === 'found').length,
        totalReturned: items.filter(i => i.status === 'returned').length,
        successRate: Math.round((items.filter(i => i.status === 'returned').length / Math.max(items.length, 1)) * 100)
      };

      const filteredItems = items.filter(item => {
        if (item.is_flagged && (!currentUser || (currentUser.role !== 'admin' && currentUser.id !== item.user_id))) return false;
        if (selectedTab === 'lost' && item.type !== 'lost') return false;
        if (selectedTab === 'found' && item.type !== 'found') return false;
        if (selectedTab === 'returned' && item.status !== 'returned') return false;
        if (selectedCategory !== 'All' && item.category !== selectedCategory) return false;
        if (selectedLocation !== 'All' && !item.location.toLowerCase().includes(selectedLocation.toLowerCase())) return false;
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          return item.title.toLowerCase().includes(q) || item.description.toLowerCase().includes(q) || item.location.toLowerCase().includes(q);
        }
        return true;
      }).sort((a, b) => {
        const dateA = new Date(a.date_occurred || a.created_at);
        const dateB = new Date(b.date_occurred || b.created_at);
        return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
      });

      return (
        <AppContext.Provider value={{
          currentUser, handleLogin, handleLogout, switchDemoPersona,
          items, filteredItems, saveItem, deleteItem, toggleFlagItem, editingItem, setEditingItem,
          claims, submitClaim, reviewClaim,
          notifications: currentUser ? notifications.filter(n => n.user_id === currentUser.id) : [],
          currentView, setCurrentView,
          searchQuery, setSearchQuery, selectedCategory, setSelectedCategory, selectedLocation, setSelectedLocation,
          selectedTab, setSelectedTab, sortOrder, setSortOrder, viewMode, setViewMode,
          authModalOpen, setAuthModalOpen, authModalMode, setAuthModalMode,
          reportModalOpen, setReportModalOpen, reportModalType, setReportModalType,
          detailModalItem, setDetailModalItem, claimModalItem, setClaimModalItem,
          toasts, showToast, removeToast, stats
        }}>
          {children}
        </AppContext.Provider>
      );
    }

    const useApp = () => useContext(AppContext);

    // --- NAVBAR ---
    function Navbar() {
      const { 
        currentUser, handleLogout, switchDemoPersona, notifications, 
        currentView, setCurrentView, setAuthModalOpen, setAuthModalMode,
        setReportModalOpen, setReportModalType 
      } = useApp();

      const [demoOpen, setDemoOpen] = useState(false);
      const [userOpen, setUserOpen] = useState(false);
      const unreadCount = notifications.filter(n => !n.is_read).length;

      const openReport = (type) => {
        if (!currentUser) { setAuthModalOpen(true); return; }
        setReportModalType(type);
        setReportModalOpen(true);
      };

      return (
        <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            
            {/* Logo */}
            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setCurrentView('landing')}>
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 via-blue-900 to-blue-600 flex items-center justify-center text-white shadow-md font-bold">
                CL
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <span className="font-extrabold text-slate-900 tracking-tight text-lg">Campus Lost & Found</span>
                  <span className="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200">Campus Net</span>
                </div>
                <p className="text-[11px] text-slate-500">Centralized University Belonging Registry</p>
              </div>
            </div>

            {/* Nav links */}
            <nav className="hidden md:flex items-center gap-2">
              <button
                onClick={() => setCurrentView('landing')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentView === 'landing' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Home
              </button>
              <button
                onClick={() => setCurrentView('browse')}
                className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentView === 'browse' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Browse Items
              </button>
              {currentUser && (
                <button
                  onClick={() => setCurrentView('dashboard')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentView === 'dashboard' ? 'bg-blue-50 text-blue-700' : 'text-slate-600 hover:text-slate-900'}`}
                >
                  Dashboard
                </button>
              )}
              {currentUser?.role === 'admin' && (
                <button
                  onClick={() => setCurrentView('admin')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${currentView === 'admin' ? 'bg-purple-50 text-purple-700' : 'text-purple-600 hover:bg-purple-50'}`}
                >
                  Admin Moderation
                </button>
              )}
            </nav>

            {/* Actions */}
            <div className="flex items-center gap-2 sm:gap-3">
              {/* Report buttons */}
              <button
                onClick={() => openReport('lost')}
                className="hidden sm:inline-flex px-3 py-1.5 rounded-lg text-xs font-bold text-rose-700 bg-rose-50 hover:bg-rose-100 border border-rose-200"
              >
                + Report Lost
              </button>
              <button
                onClick={() => openReport('found')}
                className="hidden sm:inline-flex px-3 py-1.5 rounded-lg text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200"
              >
                + Report Found
              </button>

              {/* Demo Mode Persona Switcher */}
              <div className="relative">
                <button
                  onClick={() => setDemoOpen(!demoOpen)}
                  className="px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 flex items-center gap-1.5"
                >
                  <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                  <span>Demo: {currentUser?.role?.toUpperCase() || 'GUEST'}</span>
                </button>

                {demoOpen && (
                  <div className="absolute right-0 mt-2 w-64 bg-white rounded-2xl shadow-2xl border border-slate-200 p-3 z-50">

      const flagged = items.filter(i => i.is_flagged);

      return (
        <div className="min-h-screen py-8 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div className="bg-slate-900 text-white p-6 rounded-3xl mb-8 flex justify-between items-center">
            <div>
              <h1 className="text-2xl font-extrabold">Campus Moderation Command</h1>
              <p className="text-xs text-slate-400">Moderator: {currentUser.full_name} • University Security Staff</p>
            </div>
            <span className="px-3 py-1 bg-rose-500/20 text-rose-300 rounded-full text-xs font-bold border border-rose-500/30">
              {flagged.length} Flagged Reports
            </span>
          </div>

          <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase">
                <tr>
                  <th className="p-4">Item</th>
                  <th className="p-4">Type</th>
                  <th className="p-4">Reporter</th>
                  <th className="p-4">Status</th>
                  <th className="p-4 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {items.map(item => (
                  <tr key={item.id} className="hover:bg-slate-50">
                    <td className="p-4 font-bold text-slate-900">{item.title}</td>
                    <td className="p-4 uppercase">{item.type}</td>
                    <td className="p-4">{item.reporter_name}</td>
                    <td className="p-4">
                      <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.is_flagged ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-700'}`}>
                        {item.is_flagged ? 'FLAGGED' : item.status}
                      </span>
                    </td>
                    <td className="p-4 text-right space-x-2">
                      <button onClick={() => toggleFlagItem(item.id)} className="text-amber-600 font-bold hover:underline">
                        {item.is_flagged ? 'Unflag' : 'Flag'}
                      </button>
                      <button onClick={() => deleteItem(item.id)} className="text-rose-600 font-bold hover:underline">
                        Delete
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- MODALS (Detail, Claim, Report, Auth, Toast) ---
    function ItemDetailModal() {
      const { detailModalItem, setDetailModalItem, setClaimModalItem, currentUser, setAuthModalOpen } = useApp();
      if (!detailModalItem) return null;
      const item = detailModalItem;

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-xl w-full overflow-hidden shadow-2xl p-6 relative">
            <button onClick={() => setDetailModalItem(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700">✕</button>
            <img src={item.image_url} className="w-full h-56 object-cover rounded-2xl mb-4" />
            <span className="text-xs font-bold text-blue-600 uppercase">{item.type} • {item.category}</span>
            <h2 className="text-2xl font-extrabold text-slate-900 mt-1">{item.title}</h2>
            <div className="mt-3 text-xs text-slate-500 space-y-1">
              <p>📍 Location: {item.location}</p>
              <p>📅 Date: {item.date_occurred}</p>
              <p>👤 Reported By: {item.reporter_name}</p>
            </div>
            <p className="mt-4 text-sm text-slate-700 bg-slate-50 p-4 rounded-2xl border border-slate-200">{item.description}</p>
            
            <div className="mt-6 flex justify-end gap-2">
              <button onClick={() => setDetailModalItem(null)} className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600">Close</button>
              {item.type === 'found' && currentUser?.id !== item.user_id && item.status !== 'returned' && (
                <button
                  onClick={() => { setClaimModalItem(item); setDetailModalItem(null); }}
                  className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-xs"
                >
                  This Is My Item
                </button>
              )}
            </div>
          </div>
        </div>
      );
    }

    function ClaimModal() {
      const { claimModalItem, setClaimModalItem, submitClaim, currentUser } = useApp();
      const [proof, setProof] = useState('');
      const [contact, setContact] = useState(currentUser?.email || '');

      if (!claimModalItem) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        submitClaim({ item_id: claimModalItem.id, proof_description: proof, contact_info: contact });
        setClaimModalItem(null);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
            <button type="button" onClick={() => setClaimModalItem(null)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-lg font-bold text-slate-900">Claim Item: Proof of Ownership</h3>
            <p className="text-xs text-slate-500 mb-4">{claimModalItem.title}</p>
            
            <label className="block text-xs font-bold text-slate-700 mb-1">Ownership Proof Description *</label>
            <textarea
              required
              rows={3}
              placeholder="Unique scratch marks, lockscreen picture, serial digit, contents of pockets..."
              value={proof}
              onChange={(e) => setProof(e.target.value)}
              className="w-full px-3 py-2 border rounded-xl text-xs mb-3"
            />

            <label className="block text-xs font-bold text-slate-700 mb-1">Campus Contact *</label>
            <input
              required
              type="text"
              value={contact}
              onChange={(e) => setContact(e.target.value)}
              className="w-full px-3 py-2 border rounded-xl text-xs mb-4"
            />

            <div className="flex justify-end gap-2">
              <button type="button" onClick={() => setClaimModalItem(null)} className="px-4 py-2 text-xs text-slate-600">Cancel</button>
              <button type="submit" className="px-5 py-2 text-xs font-bold bg-blue-600 text-white rounded-xl">Submit Claim</button>
            </div>
          </form>
        </div>
      );
    }

    function ReportModal() {
      const { reportModalOpen, setReportModalOpen, reportModalType, saveItem, editingItem } = useApp();
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState(ITEM_CATEGORIES[0]);
      const [location, setLocation] = useState(CAMPUS_LOCATIONS[0]);
      const [desc, setDesc] = useState('');

      if (!reportModalOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        saveItem({ title, category, location, description: desc, type: reportModalType });
        setReportModalOpen(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <form onSubmit={handleSubmit} className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative">
            <button type="button" onClick={() => setReportModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-lg font-bold text-slate-900 mb-4">
              Report {reportModalType === 'lost' ? 'Lost Item' : 'Found Item'}
            </h3>

            <div className="space-y-3 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Item Title *</label>
                <input required type="text" placeholder="e.g. MacBook Pro 14 or Blue Backpack" value={title} onChange={e => setTitle(e.target.value)} className="w-full p-2.5 border rounded-xl" />
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Category *</label>
                  <select value={category} onChange={e => setCategory(e.target.value)} className="w-full p-2.5 border rounded-xl">
                    {ITEM_CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                  </select>
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Location *</label>
                  <select value={location} onChange={e => setLocation(e.target.value)} className="w-full p-2.5 border rounded-xl truncate">
                    {CAMPUS_LOCATIONS.map(l => <option key={l} value={l}>{l}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <label className="font-bold text-slate-700 block mb-1">Description *</label>
                <textarea required rows={3} placeholder="Provide identifying color, circumstances, appearance..." value={desc} onChange={e => setDesc(e.target.value)} className="w-full p-2.5 border rounded-xl" />
              </div>
            </div>

            <div className="mt-6 flex justify-end gap-2">
              <button type="button" onClick={() => setReportModalOpen(false)} className="px-4 py-2 text-xs text-slate-600">Cancel</button>
              <button type="submit" className="px-5 py-2.5 text-xs font-bold text-white bg-blue-600 rounded-xl">Publish Report</button>
            </div>
          </form>
        </div>
      );
    }

    function AuthModal() {
      const { authModalOpen, setAuthModalOpen, handleLogin, switchDemoPersona } = useApp();
      const [email, setEmail] = useState('');

      if (!authModalOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        handleLogin(email);
        setAuthModalOpen(false);
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <button onClick={() => setAuthModalOpen(false)} className="absolute top-4 right-4 text-slate-400">✕</button>
            <h3 className="text-lg font-bold text-slate-900 mb-1">Campus Sign In</h3>
            <p className="text-xs text-slate-500 mb-4">Enter university email or select a demo account</p>

            <div className="p-3 bg-amber-50 rounded-xl mb-4 border border-amber-200 text-xs">
              <p className="font-bold text-amber-900 mb-1.5">Quick 1-Click Demo Accounts:</p>
              <div className="flex gap-1.5">
                <button onClick={() => { switchDemoPersona('student'); setAuthModalOpen(false); }} className="px-2.5 py-1 bg-white rounded border border-amber-300 font-semibold text-slate-700">Student</button>
                <button onClick={() => { switchDemoPersona('staff'); setAuthModalOpen(false); }} className="px-2.5 py-1 bg-white rounded border border-amber-300 font-semibold text-slate-700">Staff</button>
                <button onClick={() => { switchDemoPersona('admin'); setAuthModalOpen(false); }} className="px-2.5 py-1 bg-white rounded border border-amber-300 font-semibold text-slate-700">Admin</button>
              </div>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <input
                required
                type="email"
                placeholder="student@campus.edu"
                value={email}
                onChange={e => setEmail(e.target.value)}
                className="w-full p-2.5 border rounded-xl text-xs"
              />
              <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl">
                Sign In
              </button>
            </form>
          </div>
        </div>
      );
    }

    function Toast() {
      const { toasts } = useApp();
      return (
        <div className="fixed bottom-5 right-5 z-50 space-y-2 pointer-events-none">
          {toasts.map(t => (
            <div key={t.id} className="p-3.5 bg-slate-900 text-white rounded-2xl shadow-xl text-xs font-semibold pointer-events-auto border border-slate-700">
              {t.message}
            </div>
          ))}
        </div>
      );
    }

    function Footer() {
      const { setCurrentView } = useApp();
      return (
        <footer className="bg-slate-950 text-slate-400 py-10 border-t border-slate-800 text-xs">
          <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© {new Date().getFullYear()} Campus Lost & Found Platform. University Campus Safety.</p>
            <div className="flex gap-4">
              <button onClick={() => setCurrentView('landing')} className="hover:text-white">Home</button>
              <button onClick={() => setCurrentView('browse')} className="hover:text-white">Browse</button>
              <button onClick={() => setCurrentView('dashboard')} className="hover:text-white">Dashboard</button>
            </div>
          </div>
        </footer>
      );
    }

    // --- MAIN APP ---
    function App() {
      const { currentView } = useApp();

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          <Navbar />
          <main className="flex-1">
            {currentView === 'landing' && <LandingPage />}
            {currentView === 'browse' && <BrowsePage />}
            {currentView === 'dashboard' && <StudentDashboard />}
            {currentView === 'admin' && <AdminDashboard />}
          </main>
          <Footer />

          <ItemDetailModal />
          <ClaimModal />
          <ReportModal />
          <AuthModal />
          <Toast />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <AppProvider>
        <App />
      </AppProvider>
    );
  </script>
</body>
</html>
